name: CI

on:
  push:
    branches: [development, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake pkg-config libgl1-mesa-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev
      - name: Prepare Rust toolchain
        run: rustup component add rustfmt clippy
      - name: Check plugin metadata
        run: |
          python3 - <<'PY'
          import json
          import tomllib

          with open("Cargo.toml", "rb") as file:
              workspace_version = tomllib.load(file)["workspace"]["package"]["version"]
          with open("plugins/apiwright/.codex-plugin/plugin.json", encoding="utf-8") as file:
              plugin_version = json.load(file)["version"]
          with open(".agents/plugins/marketplace.json", encoding="utf-8") as file:
              json.load(file)

          if plugin_version != workspace_version:
              raise SystemExit(
                  f"plugin version {plugin_version!r} != workspace version {workspace_version!r}"
              )
          PY
      - name: Test plugin binary staging
        run: python3 -m unittest discover -s plugins/apiwright/scripts -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check release-only code paths
        run: cargo check --release --locked -p forge-gui --bin apiwright-ide
