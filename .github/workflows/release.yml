name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake pkg-config libgl1-mesa-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev
      - name: Prepare Rust toolchain
        run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo check --release --locked -p forge-gui --bin apiwright-ide

  linux:
    name: Linux AppImage (x86_64)
    runs-on: ubuntu-22.04
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake file libfuse2 pkg-config libgl1-mesa-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev
      - name: Build AppImage and CLI
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "forge-gui") | .version')
          ./packaging/linux/build-appimage.sh "$VERSION"
          cargo build --release --locked -p forge-cli --bin apiwright
          install -m 0755 target/release/apiwright "target/release-packages/ApiWright-$VERSION-cli-linux-x86_64"
      - uses: actions/upload-artifact@v7
        with:
          name: apiwright-linux-x86_64
          path: |
            target/release-packages/*.AppImage
            target/release-packages/ApiWright-*-cli-linux-x86_64
          if-no-files-found: error

  windows:
    name: Windows EXE (x86_64)
    runs-on: windows-2025
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - name: Build executables
        shell: pwsh
        run: |
          cargo build --release --locked -p forge-gui --bin apiwright-ide
          cargo build --release --locked -p forge-cli --bin apiwright
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq "forge-gui").version
          New-Item -ItemType Directory -Force target/release-packages | Out-Null
          Copy-Item target/release/apiwright-ide.exe "target/release-packages/ApiWright-$version-windows-x86_64.exe"
          Copy-Item target/release/apiwright.exe "target/release-packages/ApiWright-$version-cli-windows-x86_64.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: apiwright-windows-x86_64
          path: target/release-packages/*.exe
          if-no-files-found: error

  macos:
    name: macOS DMG (Apple Silicon)
    runs-on: macos-15
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - name: Build disk image and CLI
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "forge-gui") | .version')
          ./packaging/macos/build-dmg.sh "$VERSION"
          cargo build --release --locked -p forge-cli --bin apiwright
          install -m 0755 target/release/apiwright "target/release-packages/ApiWright-$VERSION-cli-macOS-arm64"
      - uses: actions/upload-artifact@v7
        with:
          name: apiwright-macos-arm64
          path: |
            target/release-packages/*.dmg
            target/release-packages/ApiWright-*-cli-macOS-arm64
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag against Cargo version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "forge-gui") | .version')
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - uses: actions/download-artifact@v8
        with:
          pattern: apiwright-*
          path: dist
          merge-multiple: true
      - name: Publish checksummed assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./* --generate-notes --title "ApiWright $GITHUB_REF_NAME"
